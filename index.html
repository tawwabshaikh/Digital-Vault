<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Digital Vault — Your digital life, securely organized</title>
    <meta name="description" content="One secure place for everything you have online. Manage passwords, accounts, subscriptions, and documents." />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>" />
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; }
      html.dark, html.dark body { background-color: #0f172a !important; color: #f8fafc; }
      html.light, html.light body { background-color: #ffffff !important; color: #0f172a; }
    </style>
    <script>
      (function() {
        const theme = localStorage.getItem('dv-theme') || 'dark';
        document.documentElement.classList.remove('light', 'dark');
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
